[project]
name = "agentic-search"
version = "0.1.0"
description = "Agentic search system: query → web search → scrape → LLM extraction → structured table with source provenance"
authors = [
    {name = "Nishanth"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "fastapi (==0.115.6)",
    "uvicorn[standard] (==0.34.0)",
    "httpx (==0.28.1)",
    "beautifulsoup4 (==4.12.3)",
    "trafilatura (==1.12.2)",
    "html2text (==2024.2.26)",
    "duckduckgo-search (==7.2.1)",
    "python-dotenv (==1.0.1)",
    "rich (==13.9.4)",
    "mcp (==1.24.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)"
]
